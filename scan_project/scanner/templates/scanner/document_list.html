<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .htmx-swapping {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Pending Scanned Documents</h1>
        <div class="table-responsive">
            <table class="table table-bordered table-striped bg-white">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 25%">Original Filename</th>
                        <th style="width: 40%">Content Summary</th>
                        <th style="width: 25%">Suggested Name (Edit)</th>
                        <th style="width: 10%">Actions</th>
                    </tr>
                </thead>
                <tbody id="document-list">
                    {% for doc in documents %}
                        {% include 'scanner/partials/document_row.html' %}
                    {% empty %}
                        <tr id="empty-row">
                            <td colspan="4" class="text-center text-muted py-4">No pending documents found.</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <input type="hidden" id="last_id" name="last_id" value="{{ max_id|default:0 }}">
        <div hx-get="{% url 'poll_new_documents' %}" 
             hx-trigger="every 3s" 
             hx-include="#last_id" 
             hx-swap="afterbegin" 
             hx-target="#document-list"
             style="display:none;"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            const emptyRow = document.getElementById('empty-row');
            const tbody = document.getElementById('document-list');
            if (emptyRow && tbody && tbody.children.length > 1) {
                emptyRow.remove();
            }
        });
    </script>
</body>
</html>
