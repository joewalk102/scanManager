<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .htmx-swapping {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Pending Scanned Documents</h1>
        <div class="table-responsive">
            <table class="table table-bordered table-striped bg-white">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 25%">Original Filename</th>
                        <th style="width: 40%">Content Summary</th>
                        <th style="width: 25%">Suggested Name (Edit)</th>
                        <th style="width: 10%">Actions</th>
                    </tr>
                </thead>
                <tbody id="document-list">
                    {% for doc in documents %}
                    <tr id="doc-row-{{ doc.id }}" class="align-middle">
                        <td>{{ doc.original_filename }}</td>
                        <td>
                            <div style="max-height: 150px; overflow-y: auto;">
                                {{ doc.summary|linebreaks }}
                            </div>
                        </td>
                        <td>
                            <form id="form-{{ doc.id }}" hx-post="{% url 'rename_document' doc.id %}" hx-target="#doc-row-{{ doc.id }}" hx-swap="outerHTML swap:0.5s">
                                {% csrf_token %}
                                <input type="text" name="new_filename" class="form-control" value="{{ doc.suggested_filename }}">
                            </form>
                        </td>
                        <td>
                            <div class="d-flex flex-column gap-2">
                                <button type="submit" form="form-{{ doc.id }}" class="btn btn-success btn-sm">Rename</button>
                                <button type="button" class="btn btn-danger btn-sm" 
                                        hx-post="{% url 'ignore_document' doc.id %}" 
                                        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                                        hx-target="#doc-row-{{ doc.id }}" 
                                        hx-swap="outerHTML swap:0.5s">
                                    Ignore
                                </button>
                            </div>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4">No pending documents found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
