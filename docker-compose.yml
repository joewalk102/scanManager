version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: scanuser
      POSTGRES_PASSWORD: scanpassword
      POSTGRES_DB: scanmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    
volumes:
  postgres_data:
  ollama_data:
